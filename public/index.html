
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Block Domain - Cloudflare Gateway</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f8fafc;
      color: #1e293b;
    }

    .container {
      max-width: 440px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 6px;
      font-size: 14px;
    }

    input, select {
      border: 1px solid #cbd5e1;
    }

    button {
      margin-top: 20px;
      background: #dc2626;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 14px;
    }

    #status.success {
      color: #166534;
    }

    #status.warning {
      color: #92400e;
    }

    #status.error {
      color: #b91c1c;
    }

    #status.pending {
      color: #475569;
    }

    .description {
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>Block Domain</h2>

    <p class="description">
      Add a domain to the company Cloudflare
      Gateway DNS blocklist.
    </p>

    <form id="blockForm">

      <label for="domain">Domain</label>
      <input
        id="domain"
        type="text"
        placeholder="suspicious-example.com"
        autocomplete="off"
        spellcheck="false"
        required
      >

      <label for="reason">Reason</label>
      <select id="reason">
        <option>Phishing</option>
        <option>Malware</option>
        <option>Spam</option>
        <option>Company policy</option>
        <option>Other</option>
      </select>

      <button id="blockButton" type="submit">
        Block Domain
      </button>

    </form>

    <div
      id="status"
      role="status"
      aria-live="polite"
    ></div>

  </div>

  <script>
    const form = document.getElementById("blockForm");
    const status = document.getElementById("status");
    const button = document.getElementById("blockButton");

    function showStatus(message, type = "pending") {
      status.className = type;
      status.textContent = message;
    }

    function normalizeDomain(input) {
      let domain = input.trim().toLowerCase();

      if (
        domain.startsWith("https://") ||
        domain.startsWith("http://")
      ) {
        const url = new URL(domain);

        if (
          url.username ||
          url.password ||
          url.port
        ) {
          throw new Error("Unsupported URL.");
        }

        domain = url.hostname;
      }

      domain = domain.replace(/\.$/, "");

      const valid =
        domain.length <= 253 &&
        /^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/.test(domain);

      if (!valid) {
        throw new Error("Enter a valid domain.");
      }

      return domain;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (button.disabled) {
        return;
      }

      try {
        const domain = normalizeDomain(
          document.getElementById("domain").value
        );

        const reason =
          document.getElementById("reason").value;

        if (!confirm("Block " + domain + "?")) {
          return;
        }

        button.disabled = true;
        showStatus("Submitting request...", "pending");

        const response = await fetch("/api/block-domain", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            domain,
            reason,
            source: "missive"
          })
        });

        let result;

        try {
          result = await response.json();
        } catch {
          throw new Error(
            "The server returned an invalid response."
          );
        }

        if (
          !response.ok ||
          result.success !== true ||
          result.blocked !== true
        ) {
          throw new Error(
            result.message ||
            "Domain blocking could not be confirmed."
          );
        }

        if (result.alreadyBlocked === true) {
          showStatus(
            domain + " is already in the Cloudflare block list.",
            "warning"
          );
        } else {
          showStatus(
            domain + " was successfully added to Cloudflare Zero Trust.",
            "success"
          );
        }

      } catch (error) {
        showStatus(
          "Error: " + error.message,
          "error"
        );
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
