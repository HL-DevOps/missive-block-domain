
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Domain Management - Cloudflare Gateway</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f8fafc;
      color: #1e293b;
    }

    .container {
      max-width: 440px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 6px;
      font-size: 14px;
    }

    input, select {
      border: 1px solid #cbd5e1;
    }

    button {
      margin-top: 20px;
      background: #dc2626;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .action-selector {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .action-button {
      margin-top: 0;
      background: #e2e8f0;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .action-button.active.block {
      background: #dc2626;
      color: white;
      border-color: #dc2626;
    }

    .action-button.active.unblock {
      background: #17008B;
      color: white;
      border-color: #17008B;
    }

    .submit-button.unblock {
      background: #17008B;
    }

    #status {
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 14px;
    }

    #status.success {
      color: #166534;
    }

    #status.warning {
      color: #92400e;
    }

    #status.error {
      color: #b91c1c;
    }

    #status.pending {
      color: #475569;
    }

    .description {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .notice {
      margin-top: 14px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2 id="pageTitle">Block Domain</h2>

    <p class="description" id="description">
      Add a domain to the company Cloudflare
      Gateway DNS blocklist.
    </p>

    <div class="action-selector"
         role="group"
         aria-label="Domain action">

      <button
        id="selectBlock"
        type="button"
        class="action-button active block"
        aria-pressed="true">
        Block Domain
      </button>

      <button
        id="selectUnblock"
        type="button"
        class="action-button"
        aria-pressed="false">
        Unblock Domain
      </button>

    </div>

    <form id="domainForm">

      <label for="domain">Domain</label>

      <input
        id="domain"
        type="text"
        placeholder="suspicious-example.com"
        autocomplete="off"
        spellcheck="false"
        required
      >

      <label for="reason">Reason</label>

      <select id="reason" required>
        <option>Phishing</option>
        <option>Malware</option>
        <option>Spam</option>
        <option>Company policy</option>
        <option>Other</option>
      </select>

      <div
        class="notice"
        id="actionNotice"
        hidden>
      </div>

      <button
        id="submitButton"
        class="submit-button"
        type="submit">
        Block Domain
      </button>

    </form>

    <div
      id="status"
      role="status"
      aria-live="polite">
    </div>

  </div>

  <script>
    const form = document.getElementById("domainForm");
    const status = document.getElementById("status");
    const button = document.getElementById("submitButton");

    const pageTitle =
      document.getElementById("pageTitle");

    const description =
      document.getElementById("description");

    const reasonSelect =
      document.getElementById("reason");

    const blockSelector =
      document.getElementById("selectBlock");

    const unblockSelector =
      document.getElementById("selectUnblock");

    const actionNotice =
      document.getElementById("actionNotice");

    // Enable only after the secure unblock
    // backend and n8n workflow are tested.
    const UNBLOCK_ENABLED = false;

    let currentAction = "block";
    let submitting = false;

    const reasons = {
      block: [
        "Phishing",
        "Malware",
        "Spam",
        "Company policy",
        "Other"
      ],
      unblock: [
        "False positive",
        "Approved by InfoSec",
        "No longer a threat",
        "Other"
      ]
    };

    function showStatus(message, type = "pending") {
      status.className = type;
      status.textContent = message;
    }

    function updateReasons(action) {
      reasonSelect.replaceChildren();

      for (const reason of reasons[action]) {
        const option = document.createElement("option");
        option.value = reason;
        option.textContent = reason;
        reasonSelect.appendChild(option);
      }
    }

    function selectAction(action) {
      if (submitting) {
        return;
      }

      currentAction = action;

      const isBlock = action === "block";

      pageTitle.textContent =
        isBlock ? "Block Domain" : "Unblock Domain";

      description.textContent = isBlock
        ? "Add a domain to the company Cloudflare Gateway DNS blocklist."
        : "Remove a domain from the dedicated Blocked by Automation list.";

      blockSelector.classList.toggle(
        "active", isBlock
      );

      unblockSelector.classList.toggle(
        "active", !isBlock
      );

      blockSelector.classList.toggle(
        "block", isBlock
      );

      unblockSelector.classList.toggle(
        "unblock", !isBlock
      );

      blockSelector.setAttribute(
        "aria-pressed", String(isBlock)
      );

      unblockSelector.setAttribute(
        "aria-pressed", String(!isBlock)
      );

      button.textContent = isBlock
        ? "Block Domain"
        : "Unblock Domain";

      button.classList.toggle(
        "unblock", !isBlock
      );

      updateReasons(action);

      actionNotice.hidden = isBlock;

      if (!isBlock) {
        actionNotice.textContent =
          "Unblocking removes an exact domain entry only from the dedicated Blocked by Automation list. Other Cloudflare security controls are not modified.";
      }

      button.disabled =
        !isBlock && !UNBLOCK_ENABLED;

      if (!isBlock && !UNBLOCK_ENABLED) {
        showStatus(
          "Unblock functionality is being configured. " +
          "Requests are not enabled yet.",
          "warning"
        );
      } else {
        showStatus("");
      }
    }

    function normalizeDomain(input) {
      let domain = input.trim().toLowerCase();

      if (
        domain.startsWith("https://") ||
        domain.startsWith("http://")
      ) {
        const url = new URL(domain);

        if (
          url.username ||
          url.password ||
          url.port
        ) {
          throw new Error("Unsupported URL.");
        }

        domain = url.hostname;
      }

      domain = domain.replace(/\.$/, "");

      const valid =
        domain.length <= 253 &&
        /^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/.test(domain);

      if (!valid) {
        throw new Error("Enter a valid domain.");
      }

      return domain;
    }

    blockSelector.addEventListener(
      "click",
      () => selectAction("block")
    );

    unblockSelector.addEventListener(
      "click",
      () => selectAction("unblock")
    );

    form.addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();

        if (submitting) {
          return;
        }

        const action = currentAction;

        if (
          action === "unblock" &&
          !UNBLOCK_ENABLED
        ) {
          showStatus(
            "Unblock functionality is not enabled yet.",
            "warning"
          );
          return;
        }

        try {
          const domain = normalizeDomain(
            document.getElementById("domain").value
          );

          const reason = reasonSelect.value;

          const actionLabel = action === "block"
            ? "Block"
            : "Unblock";

          if (
            !confirm(
              actionLabel + " " + domain + "?"
            )
          ) {
            return;
          }

          submitting = true;
          button.disabled = true;

          showStatus(
            "Submitting request...",
            "pending"
          );

          const endpoint = action === "block"
            ? "/api/block-domain"
            : "/api/unblock-domain";

          const response = await fetch(endpoint, {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              domain,
              reason,
              source: "missive"
            })
          });

          let result;

          try {
            result = await response.json();
          } catch {
            throw new Error(
              "The server returned an invalid response."
            );
          }

          if (action === "block") {
            if (
              !response.ok ||
              result.success !== true ||
              result.blocked !== true
            ) {
              throw new Error(
                result.message ||
                "Domain blocking could not be confirmed."
              );
            }

            if (result.alreadyBlocked === true) {
              showStatus(
                domain +
                " is already in the Cloudflare block list.",
                "warning"
              );
            } else {
              showStatus(
                domain +
                " was successfully added to Cloudflare Zero Trust.",
                "success"
              );
            }
          } else {
            if (
              !response.ok ||
              result.success !== true ||
              result.unblocked !== true
            ) {
              throw new Error(
                result.message ||
                "Domain unblocking could not be confirmed."
              );
            }

            if (result.alreadyUnblocked === true) {
              showStatus(
                domain +
                " is not present in the automation block list.",
                "warning"
              );
            } else {
              showStatus(
                domain +
                " was successfully removed from the automation block list.",
                "success"
              );
            }
          }

        } catch (error) {
          showStatus(
            "Error: " + error.message,
            "error"
          );
        } finally {
          submitting = false;

          button.disabled =
            currentAction === "unblock" &&
            !UNBLOCK_ENABLED;
        }
      }
    );

    selectAction("block");
  </script>
</body>
</html>
